description: >-
  Alliance Holdings GP, L.P. (AHGP) was a limited partnership formed to own
  and control Alliance Resource Management GP, LLC, the managing general
  partner of Alliance Resource Partners, L.P. (ARLP), the second largest coal
  producer in the eastern United States. AHGP held a general partner interest
  and incentive distribution rights in ARLP, along with a substantial direct
  ownership stake in ARLP common units. In 2018, Alliance Holdings GP became
  a wholly-owned subsidiary of Alliance Resource Partners as part of a
  simplification transaction, with AHGP unitholders receiving ARLP common
  units in exchange. Alliance Resource Partners (NASDAQ: ARLP) continues as a
  diversified energy company generating income from coal production and mineral
  royalties from coal, oil, and gas interests across the United States. As an
  energy holding company, Alliance Holdings did not maintain a public developer
  API program.
