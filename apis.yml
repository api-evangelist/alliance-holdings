description: >-
  Alliance Holdings GP, L.P. (AHGP) was a limited partnership formed to own and
  control Alliance Resource Management GP, LLC, the managing general partner of
  Alliance Resource Partners, L.P. (ARLP), the second largest coal producer in the
  eastern United States. AHGP held a general partner interest, incentive
  distribution rights, and a direct stake in ARLP common units. In 2018 AHGP was
  absorbed into ARLP in a simplification transaction and ceased to exist as a
  separate public entity. ARLP (NASDAQ: ARLP) continues as a diversified energy
  company earning income from coal production and from coal, oil and gas mineral
  royalties. Alliance Holdings never maintained a public developer API program and
  neither does the surviving entity. The legacy ahgp.com host no longer resolves and
  alliancecoal.com redirects to www.arlp.com; probes on 2026-09-04 of arlp.com,
  www.arlp.com and investor.arlp.com found no OpenAPI, GraphQL, AsyncAPI, gRPC,
  WSDL, MCP, agent card, or served /.well-known/ document.
